services:
  quote-bot:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
    env_file: .env
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    mem_limit: 256m
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"